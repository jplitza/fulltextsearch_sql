name: Publish Release
on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: write

jobs:
  test-backend:
    uses: ./.github/workflows/test-backend.yml
  test-frontend:
    uses: ./.github/workflows/test-frontend.yml
  build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    if: ${{ github.repository_owner == 'jplitza' }}

    steps:
      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Set app env
        run: |
          # Split and keep last
          echo "APP_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Validate release version
        run: |
          APP_VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ] || [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $TAG_VERSION does not match app version $APP_VERSION and package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Create release archive
        run: >
          tar -cf - \
            --exclude '.git*' \
            --exclude 'composer.*' \
            --exclude 'node_modules' \
            --exclude 'package*.json' \
            --exclude 'src' \
            --exclude 'eslint.config.js' \
            --exclude 'stylelint.config.cjs' \
            --exclude 'tsconfig.json' \
            --exclude 'vite.config.ts' \
            --exclude 'renovate.json' \
            --transform 's/^\./${{env.APP_NAME}}/' \
            --sort=name \
            --mtime="$(git show --no-patch --format=%ci HEAD)" \
            --numeric-owner --owner=0 --group=0 \
            --mode='go+u,go-w' \
            . \
            | gzip --no-name --best \
            > ${{runner.temp}}/${{env.APP_NAME}}.tar.gz

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{runner.temp}}/${{env.APP_NAME}}.tar.gz

      - name: Update app in Nextcloud app catalog
        run: |
          echo "$KEY" > "$RUNNER_TEMP/$APP_NAME.key"
          curl -X POST \
            -H "Authorization: Token $TOKEN" \
            https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Content-Type: application/json" \
            -d@- <<EOF
          {
            "download": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APP_NAME.tar.gz",
            "signature": "$(openssl dgst -sha512 -sign "$RUNNER_TEMP/$APP_NAME.key" "$RUNNER_TEMP/$APP_NAME.tar.gz" | openssl base64)"
          }
          EOF
        env:
          TOKEN: ${{ secrets.NEXTCLOUD_APPSTORE_API_TOKEN }}
          KEY: ${{ secrets.NEXTCLOUD_APPSTORE_KEY }}
